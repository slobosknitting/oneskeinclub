<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club de la Madeja - Enlaces</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a02c89 0%, #d14ba8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .logo-container {
            margin-bottom: 20px;
        }

        .logo-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        h1 {
            color: #644b3f;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        p {
            color: #7f8c8d;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .link-list li {
            margin-bottom: 15px;
        }

        .link-button {
            display: inline-block;
            background: #644b3f; /* Color café */
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s ease, transform 0.3s ease;
            width: 100%;
            max-width: 300px;
        }

        .link-button:hover {
            background: #4a3a31; /* Un café un poco más oscuro */
            transform: translateY(-2px);
        }

        .branding-footer {
            margin-top: 30px;
            text-align: center;
            color: #e9ecef;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="logo_Blog.png" alt="Logo de Club de la Madeja" class="logo-image">
        </div>
        <h1>Club de la Madeja</h1>
        <p>Recursos para Tejedoras Activas</p>

        <ul class="link-list">
            <li><a href="Organizando%20mi%20Stash.html" class="link-button">Recursos</a></li>
            <li><a href="https://susanalobosknits.com/" class="link-button">Patrones en Español</a></li>
            <li><a href="https://www.youtube.com/@susanalobosdesigns" class="link-button">Tutoriales</a></li>
            <li><a href="https://susanacuervolobos.substack.com/about" class="link-button">Newsletter</a></li>
<li><a href="https://forms.gle/G2P5g4Ux98MULiEY6" class="link-button">Testadoras Team</a></li>

        </ul>
    </div>
    
    <div class="branding-footer">
        © 2025 Susana Lobos Designs .:. Disfruta de todo tu potencial creativo .:.
    </div>
</body>
</html>
